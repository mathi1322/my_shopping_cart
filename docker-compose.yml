services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shopping_cart}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopping_cart}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopping_cart}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: ['npm', 'run', 'db:seed']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopping_cart}
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopping_cart}
      PORT: 4321
      HOST: 0.0.0.0
    ports:
      - '${APP_PORT:-4321}:4321'
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
